title: Daniel @ Dantas Files
paginate: 20
description: "Technology in NJ"
future: true
author:
  name: Daniel Dantas
  email: daniel@dantasfiles.com
  url: https://dantasfiles.com/

plugins:
  - jekyll-sitemap
  - jekyll-feed
  - jekyll-seo-tag
  
remote_theme: jekyll/minima

show_excerpts: true

collections:
  princeton:
    output: true
  cornell:
    output: true

defaults:
  - scope:
      path: ""          # Matches all files in the targeted type
      type: "princeton"   # Must match your collection name
    values:
      layout: "reading-list"  # The name of your layout file without .html
      date: "2027-07-28"
  - scope:
      path: ""          # Matches all files in the targeted type
      type: "cornell"   # Must match your collection name
    values:
      layout: "reading-list"  # The name of your layout file without .html
      date: "2027-07-28"

minima:
  skin: classic
  social_links:
    - icon: github
      url: "https://github.com/dantasfiles"
    - icon: x-twitter
      url: "https://x.com/dantasfiles"
    - icon: google-scholar
      url: "https://scholar.google.com/citations?user=kGsoFNQAAAAJ"
    - icon: linkedin
      url: "https://www.linkedin.com/in/dantasfiles"
    - icon: letterboxd
      url: "https://letterboxd.com/dantasfiles/"
      

